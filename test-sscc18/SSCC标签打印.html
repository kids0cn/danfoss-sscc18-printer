<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSCC-18 标签打印工具</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e60000">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="assets/BrowserPrint-3.0.216.min.js"></script>
    <style>
        :root { --df-red: #e60000; --df-red-dark: #c00; }
        body { background: #f5f5f5; min-height: 100vh; }

        /* ===== Header ===== */
        .app-header {
            background: var(--df-red);
            color: #fff;
            padding: 0 20px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 6px rgba(0,0,0,.15);
            position: sticky; top: 0; z-index: 100;
        }
        .app-header .left { display: flex; align-items: center; gap: 14px; }
        .app-header img { height: 35px; }
        .app-header h1 { font-size: 20px; font-weight: 500; margin: 0; }
        .app-header .right { display: flex; align-items: center; gap: 12px; }
        .btn-icon {
            background: none; border: none; color: #fff;
            font-size: 20px; cursor: pointer; padding: 4px 8px;
            border-radius: 6px; transition: background .15s;
        }
        .btn-icon:hover { background: rgba(255,255,255,.15); }

        /* ===== Status badge ===== */
        .badge-status {
            padding: 3px 10px; border-radius: 10px;
            font-size: 12px; font-weight: 500;
        }
        .badge-ok { background: #52c41a; color: #fff; }
        .badge-err { background: #ff4d4f; color: #fff; }
        .badge-warn { background: #faad14; color: #333; }

        /* ===== Main content ===== */
        .main { max-width: 640px; margin: 0 auto; padding: 16px; }

        /* 扫码页垂直居中 */
        #page-scan {
            display: flex; flex-direction: column;
            justify-content: center;
            min-height: calc(100vh - 70px);
        }

        /* ===== Scan input ===== */
        .scan-box {
            background: #fff; border-radius: 12px;
            padding: 24px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
            margin-bottom: 16px;
        }
        .scan-input {
            width: 100%; height: 72px;
            font-size: 28px; font-family: 'Consolas', monospace;
            padding: 0 20px; letter-spacing: 3px;
            border: 2px solid #ddd; border-radius: 12px;
            outline: none; transition: border-color .2s, box-shadow .2s;
        }
        .scan-input:focus {
            border-color: var(--df-red);
            box-shadow: 0 0 0 3px rgba(230,0,0,.12);
        }
        .scan-input::placeholder { color: #bbb; letter-spacing: 0; font-size: 15px; font-family: inherit; }
        .scan-hint { text-align: center; color: #aaa; font-size: 13px; margin-top: 12px; }

        /* ===== Validation ===== */
        .validate-msg {
            margin-top: 10px; padding: 10px 14px;
            border-radius: 8px; font-size: 13px; display: none;
        }
        .v-pass { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
        .v-fail { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
        .v-detail {
            display: grid; grid-template-columns: 80px 1fr;
            gap: 4px 10px; margin-top: 6px; font-size: 12px;
        }
        .v-detail .lbl { color: #999; text-align: right; }
        .v-detail .val { font-family: monospace; font-weight: 500; }

        /* ===== History ===== */
        .history-box {
            background: #fff; border-radius: 10px;
            padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
            margin-top: 16px;
        }
        .history-title {
            font-size: 14px; font-weight: 600; color: #333;
            margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
        }
        .history-title .count {
            background: var(--df-red); color: #fff;
            font-size: 11px; padding: 1px 7px;
            border-radius: 8px; font-weight: 500;
        }
        .history-empty { color: #bbb; font-size: 13px; text-align: center; padding: 20px 0; }
        .history-list { max-height: 360px; overflow-y: auto; }
        .history-row {
            display: grid; grid-template-columns: 70px 1fr auto;
            gap: 8px; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
        }
        .history-row:last-child { border-bottom: none; }
        .history-row .time { color: #999; font-size: 12px; }
        .history-row .code { font-family: monospace; font-weight: 500; word-break: break-all; }
        .history-row .reprint {
            background: none; border: 1px solid #ddd; color: #666;
            padding: 2px 8px; border-radius: 4px; font-size: 11px;
            cursor: pointer; white-space: nowrap;
        }
        .history-row .reprint:hover { border-color: var(--df-red); color: var(--df-red); }

        /* ===== Drawer 侧边栏 ===== */
        .drawer-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.35); z-index: 200;
        }
        .drawer-overlay.open { display: block; }
        .drawer {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 33vw; min-width: 320px;
            background: #fff; z-index: 201;
            transform: translateX(100%);
            transition: transform .25s ease;
            box-shadow: -4px 0 16px rgba(0,0,0,.15);
            overflow-y: auto;
        }
        .drawer.open { transform: translateX(0); }
        .drawer-header {
            position: sticky; top: 0; z-index: 1;
            background: var(--df-red); color: #fff;
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .drawer-header h3 { font-size: 15px; font-weight: 600; margin: 0; }
        .drawer-body { padding: 20px; }
        .settings-card {
            background: #fff; border-radius: 12px;
            padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
            margin-bottom: 16px;
        }
        .settings-card h6 {
            font-size: 15px; font-weight: 600; color: #333;
            margin-bottom: 14px; padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .form-row {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; margin-bottom: 12px;
        }
        .form-row.single { grid-template-columns: 1fr; }
        .form-group label { font-size: 13px; color: #666; font-weight: 500; display: block; margin-bottom: 4px; }
        .form-group select,
        .form-group input {
            width: 100%; height: 40px; padding: 0 10px;
            border: 1px solid #ddd; border-radius: 6px;
            font-size: 14px; outline: none; background: #fff;
        }
        .form-group select:focus,
        .form-group input:focus { border-color: var(--df-red); }
        .form-check { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .form-check input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--df-red); }

        .btn-save {
            width: 100%; height: 44px; border: none; border-radius: 8px;
            background: var(--df-red); color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .btn-save:hover { background: var(--df-red-dark); }

        .custom-size-row { display: none; gap: 6px; align-items: center; }
        .custom-size-row.show { display: flex; }
        .custom-size-row input { width: 60px; }

        /* ===== Toast ===== */
        .toast-msg {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            padding: 8px 20px; border-radius: 8px;
            font-size: 13px; font-weight: 500; z-index: 9999;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            animation: fadeIn .2s;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateX(-50%) translateY(-8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
        .t-ok { background: #52c41a; color: #fff; }
        .t-err { background: #ff4d4f; color: #fff; }
        .t-info { background: #0078d4; color: #fff; }

        /* ===== Print button (manual mode) ===== */
        .btn-print {
            width: 100%; height: 48px; border: none; border-radius: 10px;
            background: var(--df-red); color: #fff;
            font-size: 16px; font-weight: 600; cursor: pointer;
            margin-top: 12px;
        }
        .btn-print:hover:not(:disabled) { background: var(--df-red-dark); }
        .btn-print:disabled { opacity: .4; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- ========== HEADER ========== -->
<div class="app-header">
    <div class="left">
        <img src="assets/new-logo-danfoss.png" alt="Danfoss">
        <h1>SSCC-18 标签打印</h1>
    </div>
    <div class="right">
        <span id="printerStatus" class="badge-status badge-warn">检测中...</span>
        <button class="btn-icon" onclick="toggleDrawer()" title="设置">⚙️</button>
    </div>
</div>

<!-- ========== MAIN ========== -->
<div class="main">

    <!-- ===== 扫码页 ===== -->
    <div class="page active" id="page-scan">
        <div class="scan-box">
            <input type="text" id="scanInput" class="scan-input"
                   placeholder="请扫描 SSCC-18 条码..." autofocus autocomplete="off" maxlength="20">
            <div class="scan-hint">扫描枪扫码后自动识别并打印</div>
            <div id="validateMsg" class="validate-msg"></div>
            <button class="btn-print" id="btnPrint" onclick="doPrint()" disabled>🖨️ 打印此标签</button>
        </div>

        <div class="history-box">
            <div class="history-title">
                🕐 今日扫码记录
                <span class="count" id="historyCount">0</span>
            </div>
            <div id="historyList">
                <div class="history-empty">暂无扫码记录</div>
            </div>
        </div>
    </div>

    <!-- ===== 设置抽屉 ===== -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="settingsDrawer">
        <div class="drawer-header">
            <h3>⚙️ 打印设置</h3>
            <button class="btn-icon" onclick="toggleDrawer()" style="font-size:18px;">✕</button>
        </div>
        <div class="drawer-body">

        <div class="settings-card">
            <h6>🖨️ 打印模式</h6>
            <div class="form-row single">
                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="autoPrint" checked>
                        <label for="autoPrint" style="font-size:13px;color:#333;margin:0;">扫码后自动打印（关闭则需手动点击打印按钮）</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <h6>🏷️ 标签设置</h6>
            <div class="form-row">
                <div class="form-group">
                    <label>标签尺寸 (mm)</label>
                    <select id="labelSize">
                        <option value="102x63" selected>102 × 63</option>
                        <option value="100x60">100 × 60</option>
                        <option value="80x50">80 × 50</option>
                        <option value="50x30">50 × 30</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>
                <div class="form-group" id="customSizeGroup" style="display:none;">
                    <label>自定义宽×高 (mm)</label>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <input type="number" id="customW" value="102" min="20" max="200" style="width:60px;">
                        <span>×</span>
                        <input type="number" id="customH" value="63" min="20" max="200" style="width:60px;">
                    </div>
                </div>
                <div class="form-group">
                    <label>打印方向</label>
                    <select id="orientation">
                        <option value="landscape" selected>横向</option>
                        <option value="portrait">纵向</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>打印浓度</label>
                    <select id="density">
                        <option value="8">8 (浅)</option>
                        <option value="12">12 (正常)</option>
                        <option value="16" selected>16 (标准)</option>
                        <option value="20">20 (深)</option>
                        <option value="25">25 (很深)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>打印份数</label>
                    <select id="printCopies">
                        <option value="1" selected>1 份</option>
                        <option value="2">2 份</option>
                        <option value="3">3 份</option>
                        <option value="5">5 份</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="settings-card">
            <h6>📊 条码设置</h6>
            <div class="form-row">
                <div class="form-group">
                    <label>条码高度 (mm) <span style="font-weight:normal;color:#999;font-size:11px;">1mm=8dots</span></label>
                    <input type="number" id="barcodeHeight" value="25" min="5" max="80">
                </div>
                <div class="form-group">
                    <label>条码宽度倍数</label>
                    <select id="barcodeWidth">
                        <option value="1">1 (窄)</option>
                        <option value="2">2</option>
                        <option value="3" selected>3 (标准)</option>
                        <option value="4">4</option>
                        <option value="5">5 (宽)</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>X 偏移 (mm) <span style="font-weight:normal;color:#999;font-size:11px;">×8=dots</span></label>
                    <input type="number" id="barcodeX" value="2.5" min="0" max="100" step="0.5">
                </div>
                <div class="form-group">
                    <label>Y 偏移 (mm) <span style="font-weight:normal;color:#999;font-size:11px;">×8=dots</span></label>
                    <input type="number" id="barcodeY" value="6.25" min="0" max="100" step="0.5">
                </div>
            </div>
        </div>

        <div class="settings-card">
            <h6>🔤 文字设置</h6>
            <div class="form-row">
                <div class="form-group">
                    <label>顶部标题</label>
                    <input type="text" id="topText" placeholder="如: SSCC-18 标签">
                </div>
                <div class="form-group">
                    <label>标题字号</label>
                    <select id="topFontSize">
                        <option value="18">18</option>
                        <option value="22" selected>22</option>
                        <option value="28">28</option>
                        <option value="36">36</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>人可读字号</label>
                    <select id="hrFontSize">
                        <option value="14">14</option>
                        <option value="18" selected>18</option>
                        <option value="22">22</option>
                        <option value="28">28</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>日期字号</label>
                    <select id="dateFontSize">
                        <option value="14">14</option>
                        <option value="16" selected>16</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>文字 Y 偏移 (mm) <span style="font-weight:normal;color:#999;font-size:11px;">×8=dots</span></label>
                    <input type="number" id="textYOffset" value="0" min="-25" max="50" step="0.5">
                </div>
                <div class="form-group">
                    <label>日期显示</label>
                    <select id="showDate">
                        <option value="yes" selected>显示</option>
                        <option value="no">不显示</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="btn-save" onclick="saveSettings()">💾 保存设置</button>
        <div style="height:10px;"></div>
        <button class="btn-save" style="background:#666;" onclick="printTestLabel()">🖨️ 打印测试标签</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// 设置 localStorage
// ============================================================
const SETTINGS_KEY = 'sscc18_settings';
const HISTORY_KEY_PREFIX = 'sscc18_history_';

const defaultSettings = {
    autoPrint: true,
    labelSize: '102x63', customW: 102, customH: 63,
    orientation: 'landscape', density: '16', printCopies: '1',
    barcodeHeight: '25', barcodeWidth: '3', barcodeX: '2.5', barcodeY: '6.25',
    topText: '', topFontSize: '22', hrFontSize: '18', dateFontSize: '16',
    textYOffset: '0', showDate: 'yes'
};

function loadSettings() {
    try { return { ...defaultSettings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY)) }; }
    catch { return { ...defaultSettings }; }
}

function getSettings() {
    const s = loadSettings();
    const DOTS = 8;
    let lw, lh;
    if (s.labelSize === 'custom') { lw = Number(s.customW)||102; lh = Number(s.customH)||63; }
    else { [lw, lh] = s.labelSize.split('x').map(Number); }
    if (s.orientation === 'portrait') [lw, lh] = [lh, lw];
    return {
        ...s,
        labelW: lw, labelH: lh,
        labelWidthDots: Math.round(lw * DOTS), labelHeightDots: Math.round(lh * DOTS),
        bcHeightDots: Math.round((Number(s.barcodeHeight)||25) * DOTS),
        bcWidth: Number(s.barcodeWidth)||3,
        bcX: Math.round((Number(s.barcodeX)||2.5) * DOTS),
        bcY: Math.round((Number(s.barcodeY)||6.25) * DOTS),
        topFontSize: Number(s.topFontSize)||22, hrFontSize: Number(s.hrFontSize)||18,
        dateFontSize: Number(s.dateFontSize)||16,
        textYOffset: Math.round((Number(s.textYOffset)||0) * DOTS),
        copies: Number(s.printCopies)||1
    };
}

function saveSettings() {
    const fields = ['autoPrint','labelSize','customW','customH','orientation','density','printCopies',
        'barcodeHeight','barcodeWidth','barcodeX','barcodeY',
        'topText','topFontSize','hrFontSize','dateFontSize','textYOffset','showDate'];
    const data = {};
    fields.forEach(id => { const el = document.getElementById(id); data[id] = el.type === 'checkbox' ? el.checked : el.value; });
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(data));
    showToast('✅ 设置已保存', 'ok');
}

function applySettings() {
    const s = loadSettings();
    Object.keys(s).forEach(k => {
        const el = document.getElementById(k);
        if (!el) return;
        if (el.type === 'checkbox') el.checked = !!s[k];
        else el.value = s[k];
    });
    document.getElementById('customSizeGroup').style.display = s.labelSize === 'custom' ? 'block' : 'none';
    updatePrintBtn(s.autoPrint);
}

function updatePrintBtn(autoPrint) {
    const btn = document.getElementById('btnPrint');
    if (autoPrint) {
        btn.style.background = '#52c41a';
        btn.innerHTML = '✅ 自动打印已开启';
        btn.disabled = true;
    } else {
        btn.style.background = '#e60000';
        btn.innerHTML = '🖨️ 打印此标签';
    }
}

// ============================================================
// 今日历史
// ============================================================
function todayKey() { return new Date().toISOString().slice(0, 10); }

function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY_PREFIX + todayKey())) || []; }
    catch { return []; }
}

function saveHistory(list) {
    localStorage.setItem(HISTORY_KEY_PREFIX + todayKey(), JSON.stringify(list));
}

function addHistory(code) {
    const list = loadHistory();
    const now = new Date();
    const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    list.unshift({ time, code });
    if (list.length > 50) list.pop();
    saveHistory(list);
    renderHistory();
}

function renderHistory() {
    const list = loadHistory();
    const el = document.getElementById('historyList');
    const cnt = document.getElementById('historyCount');
    cnt.textContent = list.length;
    if (!list.length) { el.innerHTML = '<div class="history-empty">暂无扫码记录</div>'; return; }
    el.innerHTML = '<div class="history-list">' + list.map(item =>
        `<div class="history-row">
            <span class="time">${item.time}</span>
            <span class="code">${item.code}</span>
            <button class="reprint" onclick="reprint('${item.code.replace(/'/g,"\\'")}')">重打</button>
        </div>`
    ).join('') + '</div>';
}

function reprint(code) {
    document.getElementById('scanInput').value = code;
    doPrint(code);
}

// ============================================================
// SSCC-18 逻辑（沿用已有代码）
// ============================================================
function normalizeScanInput(raw) {
    const t = raw.trim();
    if (/^\d{20}$/.test(t) && t.startsWith('00')) return { code: t.slice(2), ai: '00', source: t };
    if (/^\d{18}$/.test(t)) return { code: t, ai: '00', source: t };
    return { code: t, ai: null, source: t };
}

function sscc18CalcCheckDigit(d17) {
    let sum = 0;
    for (let i = 0; i < 17; i++) sum += (i % 2 === 0 ? 3 : 1) * parseInt(d17[i]);
    return sum % 10 === 0 ? 0 : 10 - sum % 10;
}

function validateSSCC18(code) {
    const t = code.trim();
    if (!/^\d+$/.test(t)) return { valid: false, msg: '❌ 必须全部是数字' };
    if (t.length !== 18) return { valid: false, msg: `❌ 长度 ${t.length} 位（需要18位）` };
    const exp = sscc18CalcCheckDigit(t.slice(0, 17));
    if (exp !== parseInt(t[17])) return { valid: false, msg: `❌ 校验位错误：期望 ${exp}，实际 ${t[17]}` };
    return {
        valid: true, msg: '✅ SSCC-18 验证通过',
        detail: {
            full: t, extension: t[0], companyPrefix: t.slice(1,8),
            serialRef: t.slice(8,17), checkDigit: t[17],
            humanReadable: `(00) ${t[0]} ${t.slice(1,8)} ${t.slice(8,17)} ${t[17]}`
        }
    };
}

function getDefaultSSCC18() {
    const base = '15714571014810270';
    return '00' + base + sscc18CalcCheckDigit(base);
}

// ============================================================
// ZPL 生成
// ============================================================
function generateSSCC18Zpl(code, titleOverride) {
    const s = getSettings();
    const cx = Math.round(s.labelWidthDots / 2);
    let z = '^XA\n^CI28\n^JMA\n^SEE:GB18030.DAT^FS\n^CWZ,E:SIMSUN.FNT\n';
    z += '^MD' + s.density + '\n^LL' + s.labelHeightDots + '\n^PW' + s.labelWidthDots + '\n';

    const title = titleOverride || s.topText;
    let y = s.bcY;
    if (title) {
        const tx = cx - Math.round(title.length * s.topFontSize * 0.35);
        z += '^FO' + tx + ',' + y + '\n^A0,N' + s.topFontSize + '\n^FD' + title + '^FS\n';
        y += s.topFontSize + 10;
    }
    z += '^FO' + s.bcX + ',' + y + '\n^BY' + s.bcWidth + '\n^BCN,' + s.bcHeightDots + ',N,N,N\n^FD00' + code + '^FS\n';

    const v = validateSSCC18(code);
    const hr = v.valid ? v.detail.humanReadable : code;
    const hrY = y + s.bcHeightDots + 8;
    z += '^FO' + (cx - Math.round(hr.length * s.hrFontSize * 0.35)) + ',' + (hrY + s.textYOffset) + '\n^A0,N' + s.hrFontSize + '\n^FD' + hr + '^FS\n';

    if (s.showDate === 'yes') {
        const d = new Date(); const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        const dy = hrY + s.hrFontSize + 6 + s.textYOffset;
        z += '^FO' + (cx - Math.round(ds.length * s.dateFontSize * 0.35)) + ',' + dy + '\n^A0,N' + s.dateFontSize + '\n^FD' + ds + '^FS\n';
    }
    return z + '^XZ\n';
}

// ============================================================
// 打印机通信
// ============================================================
let currentDevice = null;

async function initPrinter() {
    const el = document.getElementById('printerStatus');
    try {
        currentDevice = await new Promise((ok, err) => BrowserPrint.getDefaultDevice("printer", ok, err));
        el.textContent = '✅ ' + currentDevice.name;
        el.className = 'badge-status badge-ok';
    } catch {
        el.textContent = '❌ 未连接';
        el.className = 'badge-status badge-err';
    }
}

async function sendZpl(zpl) {
    if (!currentDevice) throw new Error('打印机未连接');
    return new Promise((ok, err) => currentDevice.send(zpl, ok, e => err(new Error(e))));
}

async function doPrint(codeOverride) {
    const raw = (codeOverride || '').trim() || document.getElementById('scanInput').value.trim();
    if (!raw) return;
    if (!currentDevice) { showToast('打印机未连接', 'err'); return; }
    // 校验 SSCC-18
    const norm = normalizeScanInput(raw);
    if (norm.code.length !== 18) { showToast('❌ 需要18位SSCC码', 'err'); return; }
    const v = validateSSCC18(norm.code);
    if (!v.valid) { showToast(v.msg, 'err'); return; }
    try {
        const s = getSettings();
        for (let i = 0; i < s.copies; i++) await sendZpl(generateSSCC18Zpl(norm.code));
        showToast('✅ 打印成功', 'ok');
        addHistory(norm.code);
        document.getElementById('scanInput').value = '';
        document.getElementById('scanInput').style.borderColor = '#ddd';
        document.getElementById('validateMsg').style.display = 'none';
        document.getElementById('btnPrint').disabled = true;
    } catch (e) { showToast('打印失败: ' + e.message, 'err'); }
}

async function printTestLabel() {
    if (!currentDevice) { showToast('打印机未连接', 'err'); return; }
    try {
        const raw = getDefaultSSCC18();
        const norm = normalizeScanInput(raw);
        for (let i = 0; i < getSettings().copies; i++)
            await sendZpl(generateSSCC18Zpl(norm.code, 'SSCC-18 TEST'));
        showToast('✅ 测试标签已打印', 'ok');
    } catch (e) { showToast('打印失败: ' + e.message, 'err'); }
}

// ============================================================
// 扫码处理
// ============================================================
function handleScan(raw) {
    if (!raw) { document.getElementById('validateMsg').style.display = 'none'; return; }

    // 自动识别：20位含00前缀 → 提取18位SSCC（不改输入框）
    const norm = normalizeScanInput(raw);
    const sscc = norm.code;

    // 验证能否转化为合法SSC-18
    const v = validateSSCC18(sscc);
    const el = document.getElementById('validateMsg');
    const input = document.getElementById('scanInput');

    if (v.valid) {
        el.className = 'validate-msg v-pass';
        let info = '✅ SSCC-18 验证通过';
        if (norm.ai) {
            info += `<br><span style="font-size:11px;color:#999;">原始: ${norm.source} → SSCC: ${sscc}</span>`;
        }
        el.innerHTML = info;
        input.style.borderColor = '#52c41a';
        document.getElementById('btnPrint').disabled = false;
        if (loadSettings().autoPrint) doPrint(sscc);
    } else {
        el.className = 'validate-msg v-fail';
        el.innerHTML = v.msg;
        input.style.borderColor = '#ff4d4f';
        document.getElementById('btnPrint').disabled = true;
    }
    el.style.display = 'block';
}

// ============================================================
// 抽屉开关
// ============================================================
function toggleDrawer() {
    const drawer = document.getElementById('settingsDrawer');
    const overlay = document.getElementById('drawerOverlay');
    const isOpen = drawer.classList.contains('open');
    if (isOpen) {
        drawer.classList.remove('open');
        overlay.classList.remove('open');
        document.getElementById('scanInput').focus();
    } else {
        drawer.classList.add('open');
        overlay.classList.add('open');
    }
}

// ============================================================
// Toast
// ============================================================
function showToast(msg, type) {
    const d = document.createElement('div');
    d.className = 'toast-msg t-' + type;
    d.textContent = msg;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2500);
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    initPrinter();
    applySettings();
    renderHistory();

    const scanInput = document.getElementById('scanInput');
    scanInput.focus();

    // 轮询检测输入框值变化，扫码枪无论什么方式输入都能捕获
    let lastVal = '';
    setInterval(() => {
        const v = scanInput.value.trim();
        if (v.length >= 18 && v !== lastVal) {
            lastVal = v;
            handleScan(v);
        }
        if (!v) lastVal = '';
    }, 200);

    document.getElementById('labelSize').addEventListener('change', e => {
        document.getElementById('customSizeGroup').style.display = e.target.value === 'custom' ? 'block' : 'none';
    });

    // 自动打印开关实时切换打印按钮显隐
    document.getElementById('autoPrint').addEventListener('change', e => {
        updatePrintBtn(e.target.checked);
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('button') && !e.target.closest('input') && !e.target.closest('select') && !e.target.closest('.history-row'))
            scanInput.focus();
    });
});
